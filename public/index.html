<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AshishVegan | IoT Smart Monitoring & Automation Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <!-- Ambient Green Glow Accents (CSS Only, No images) -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Header -->
  <header class="w-full border-b border-emerald-900/40 bg-gray-950/60 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-700 flex items-center justify-center text-gray-950 text-xl font-bold shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-300 via-green-400 to-teal-200 bg-clip-text text-transparent">AshishVegan</span>
          <span class="text-xs ml-2 px-2 py-0.5 rounded-full border border-emerald-500/30 text-emerald-400 font-mono bg-emerald-950/50">IoT Core</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 text-xs font-mono text-emerald-400/80 bg-emerald-950/40 px-3 py-1.5 rounded-lg border border-emerald-900/50">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>ESP8266 + DHT11 + LCD + LED Ready</span>
      </div>
    </div>
  </header>

  <!-- Main Content: Login & Registration Portal -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Card Container -->
      <div class="glass-card rounded-2xl p-8 border border-emerald-500/20 shadow-2xl relative overflow-hidden">
        
        <!-- Decorative Header Glow Line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-teal-400 to-green-500"></div>

        <!-- System Branding / Icon -->
        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-950/80 border border-emerald-500/30 text-emerald-400 mb-3 shadow-inner">
            <i class="fa-solid fa-network-wired text-2xl"></i>
          </div>
          <h1 id="authTitle" class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
          <p id="authSubtitle" class="text-sm text-emerald-300/70 mt-1">Log in to manage IoT environmental telemetry and devices</p>
        </div>

        <!-- Mode Toggle Tabs (Login / Register) -->
        <div class="flex p-1 mb-6 rounded-xl bg-black/40 border border-emerald-900/60">
          <button id="tabLogin" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-500 text-gray-950 shadow-lg transition-all duration-200">
            <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign In
          </button>
          <button id="tabRegister" type="button" class="flex-1 py-2 text-sm font-medium text-emerald-300 hover:text-white rounded-lg transition-all duration-200">
            <i class="fa-solid fa-user-plus mr-1.5"></i> Register
          </button>
        </div>

        <!-- 1. LOGIN FORM -->
        <div id="loginFormContainer">
          <form id="loginForm" class="space-y-4">
            <div id="loginError" class="hidden p-3 rounded-lg bg-red-950/70 border border-red-500/50 text-red-200 text-xs flex items-center">
              <i class="fa-solid fa-triangle-exclamation mr-2"></i>
              <span></span>
            </div>

            <div>
              <label for="loginEmail" class="block text-xs font-semibold uppercase tracking-wider text-emerald-300/80 mb-1">
                Email Address
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400/60">
                  <i class="fa-regular fa-envelope"></i>
                </div>
                <input 
                  type="email" 
                  id="loginEmail" 
                  required 
                  placeholder="admin@ashishvegan.com"
                  class="w-full pl-10 pr-4 py-2.5 bg-black/50 border border-emerald-900 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 rounded-xl text-white placeholder-emerald-800/60 text-sm outline-none transition-all"
                >
              </div>
            </div>

            <div>
              <label for="loginPassword" class="block text-xs font-semibold uppercase tracking-wider text-emerald-300/80 mb-1">
                Password
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400/60">
                  <i class="fa-solid fa-lock"></i>
                </div>
                <input 
                  type="password" 
                  id="loginPassword" 
                  required 
                  placeholder="••••••••"
                  class="w-full pl-10 pr-4 py-2.5 bg-black/50 border border-emerald-900 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 rounded-xl text-white placeholder-emerald-800/60 text-sm outline-none transition-all"
                >
              </div>
            </div>

            <button 
              type="submit" 
              id="loginSubmitBtn"
              class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-gray-950 font-bold text-sm tracking-wide shadow-lg shadow-emerald-500/25 transition duration-200 flex items-center justify-center space-x-2"
            >
              <span>Sign In to Dashboard</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </form>
        </div>

        <!-- 2. REGISTRATION FORM -->
        <div id="registerFormContainer" class="hidden">
          <form id="registerForm" class="space-y-4">
            <div id="regError" class="hidden p-3 rounded-lg bg-red-950/70 border border-red-500/50 text-red-200 text-xs flex items-center">
              <i class="fa-solid fa-triangle-exclamation mr-2"></i>
              <span></span>
            </div>

            <div>
              <label for="regName" class="block text-xs font-semibold uppercase tracking-wider text-emerald-300/80 mb-1">
                Full Name
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400/60">
                  <i class="fa-regular fa-user"></i>
                </div>
                <input 
                  type="text" 
                  id="regName" 
                  required 
                  placeholder="Sayali Randive"
                  class="w-full pl-10 pr-4 py-2.5 bg-black/50 border border-emerald-900 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 rounded-xl text-white placeholder-emerald-800/60 text-sm outline-none transition-all"
                >
              </div>
            </div>

            <div>
              <label for="regEmail" class="block text-xs font-semibold uppercase tracking-wider text-emerald-300/80 mb-1">
                Email Address
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400/60">
                  <i class="fa-regular fa-envelope"></i>
                </div>
                <input 
                  type="email" 
                  id="regEmail" 
                  required 
                  placeholder="sayali@gceoy.edu"
                  class="w-full pl-10 pr-4 py-2.5 bg-black/50 border border-emerald-900 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 rounded-xl text-white placeholder-emerald-800/60 text-sm outline-none transition-all"
                >
              </div>
            </div>

            <div>
              <label for="regPassword" class="block text-xs font-semibold uppercase tracking-wider text-emerald-300/80 mb-1">
                Create Password
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400/60">
                  <i class="fa-solid fa-lock"></i>
                </div>
                <input 
                  type="password" 
                  id="regPassword" 
                  required 
                  minlength="6"
                  placeholder="At least 6 characters"
                  class="w-full pl-10 pr-4 py-2.5 bg-black/50 border border-emerald-900 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 rounded-xl text-white placeholder-emerald-800/60 text-sm outline-none transition-all"
                >
              </div>
            </div>

            <button 
              type="submit" 
              id="regSubmitBtn"
              class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-gray-950 font-bold text-sm tracking-wide shadow-lg shadow-emerald-500/25 transition duration-200 flex items-center justify-center space-x-2"
            >
              <span>Complete Registration</span>
              <i class="fa-solid fa-user-plus text-xs"></i>
            </button>
          </form>
        </div>

        <!-- Quick Demo Hint -->
        <div class="mt-6 pt-5 border-t border-emerald-900/40 text-center text-xs text-emerald-400/60 flex items-center justify-center space-x-2">
          <i class="fa-solid fa-shield-halved text-emerald-400"></i>
          <span>SQLite Encrypted Storage • Render Deployment Ready</span>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full border-t border-emerald-900/50 bg-gray-950/80 backdrop-blur-md py-4">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-xs text-emerald-300/80 tracking-wide font-medium">
        Designed and Developed by Sayali Randive , Dept. of Electrical Engineering,  GCEOY
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/auth.js"></script>
</body>
</html>
