services:
  - type: web
    name: ashishvegan-iot
    runtime: node
    plan: free
    buildCommand: npm install && (npm rebuild sqlite3 --build-from-source || true)
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
